<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BotDetect — выявление ботов</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="layout">
    <header class="header">
      <h1>BotDetect</h1>
      <p class="subtitle">Выявление ботов в социальных сетях</p>
      <div class="user-bar">
        <label>User ID: <input type="number" id="userId" value="1" min="1" /></label>
      </div>
    </header>

    <main class="main">
      <section class="card">
        <h2>Запуск анализа</h2>
        <form id="formAnalysis">
          <label>
            Соцсеть
            <select name="socialNetwork">
              <option value="vk">VK</option>
              <option value="tg">Telegram</option>
              <option value="ig">Instagram</option>
              <option value="x">X (Twitter)</option>
            </select>
          </label>
          <label>
            ID аккаунтов (через запятую)
            <input type="text" name="accountIds" placeholder="user1, user2" required />
          </label>
          <button type="submit">Запустить анализ</button>
        </form>
        <p id="analysisMessage" class="message"></p>
      </section>

      <section class="card">
        <h2>Мои анализы</h2>
        <button type="button" id="btnRefreshAnalyses">Обновить</button>
        <div id="analysesList" class="list"></div>
        <div id="analysisDetail" class="detail"></div>
      </section>

      <section class="card">
        <h2>Аккаунты</h2>
        <form id="formAccount">
          <label>Имя пользователя <input type="text" name="username" required /></label>
          <label>
            Соцсеть
            <select name="socialNetwork">
              <option value="vk">VK</option>
              <option value="tg">Telegram</option>
              <option value="ig">Instagram</option>
              <option value="x">X</option>
            </select>
          </label>
          <button type="submit">Добавить аккаунт</button>
        </form>
        <div id="accountsList" class="list"></div>
      </section>

      <section class="card">
        <h2>Отчёты</h2>
        <button type="button" id="btnRefreshReports">Обновить</button>
        <div id="reportsList" class="list"></div>
      </section>
    </main>

    <footer class="footer">
      <small>API: <span id="apiStatus">—</span></small>
    </footer>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
