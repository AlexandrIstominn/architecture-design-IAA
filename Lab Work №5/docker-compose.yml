services:
  db:
    image: postgres:16-alpine
    container_name: botdetect-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: botdetect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d botdetect"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: botdetect-api
    environment:
      ConnectionStrings__Default: "Host=db;Database=botdetect;Username=postgres;Password=postgres"
      Cors__AllowedOrigins: "http://localhost:3000,http://frontend:3000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: botdetect-frontend
    environment:
      PORT: 3000
      API_URL: http://api:5000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
