# Непрерывная интеграция: сборка, тесты, образы Docker
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore BotDetect.sln

      - name: Build
        run: dotnet build BotDetect.sln -c Release --no-restore

      - name: Run integration tests
        run: dotnet test tests/BotDetect.Api.Tests/BotDetect.Api.Tests.csproj -c Release --no-build -v normal

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          load: true
          tags: botdetect-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: botdetect-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  postman-tests:
    name: Postman (Newman) API tests
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t botdetect-api:ci .

      - name: Start PostgreSQL
        run: |
          docker run -d --name botdetect-db \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=botdetect \
            -p 5432:5432 \
            -v ${{ github.workspace }}/database/init.sql:/docker-entrypoint-initdb.d/init.sql \
            postgres:16-alpine
          sleep 10
          docker exec botdetect-db pg_isready -U postgres -d botdetect || true

      - name: Start API container
        run: |
          docker run -d --name botdetect-api --link botdetect-db:db \
            -e ConnectionStrings__Default="Host=db;Database=botdetect;Username=postgres;Password=postgres" \
            -p 5000:5000 \
            botdetect-api:ci
          for i in $(seq 1 30); do
            curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/analysis && break
            sleep 2
          done

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: |
          newman run tests/postman/BotDetect-API.postman_collection.json \
            -e tests/postman/BotDetect-API.postman_environment.json \
            --env-var "baseUrl=http://localhost:5000" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report.html \
            --reporter-htmlextra-darkTheme

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: newman-report.html

      - name: Stop containers
        if: always()
        run: |
          docker stop botdetect-api botdetect-db 2>/dev/null || true
          docker rm botdetect-api botdetect-db 2>/dev/null || true
